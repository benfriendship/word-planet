<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb84d">
<meta name="apple-mobile-web-app-title" content="單字星球">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>單字星球</title>
<style>
  :root {
    --bg: #fff8ec; --card: #ffffff; --ink: #3a2e22; --muted: #8a7a68;
    --big: #4f8cff; --small: #8a6cf2; --accent: #ffb84d;
    --ok: #34c17a; --bad: #ff5a5a; --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  body { min-height: 100dvh; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0; min-height: 64px; }
  header h1 { font-size: 22px; margin: 0; flex: 1; }
  .back { border: 0; background: #fff; border-radius: 14px; width: 44px; height: 44px; font-size: 22px; box-shadow: 0 2px 6px #0001; }
  .stars { font-weight: 700; background: #fff; padding: 8px 12px; border-radius: 14px; box-shadow: 0 2px 6px #0001; }
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 14px #0000000f; margin-bottom: 14px; }
  .kid { display: flex; align-items: center; gap: 16px; border: 0; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .kid.big { border-left: 10px solid var(--big); } .kid.small { border-left: 10px solid var(--small); }
  .kid b { font-size: 22px; display: block; }
  .kid span { color: var(--muted); font-size: 15px; }
  .menu { display: grid; gap: 14px; }
  .range { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; }
  .range input { flex: 1; min-width: 0; padding: 10px; text-align: center; font-size: 20px; font-weight: 700; } .range .btn { width: auto; flex: none; }
  .btn { border: 0; border-radius: var(--radius); padding: 20px; font: inherit; font-size: 20px; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 4px 0 #0002; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0002; }
  .btn.blue { background: var(--big); } .btn.purple { background: var(--small); }
  .btn.orange { background: var(--accent); } .btn.gray { background: #b9ad9f; }
  .btn.green { background: var(--ok); }
  .btn small { display: block; font-weight: 400; font-size: 14px; opacity: .9; margin-top: 4px; }
  .progress { height: 12px; background: #f0e6d8; border-radius: 99px; overflow: hidden; margin: 10px 0 4px; }
  .progress i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
  .muted { color: var(--muted); font-size: 14px; }
  .flash { text-align: center; padding: 28px 20px; }
  .emoji { font-size: 96px; line-height: 1.1; }
  .word { font-size: 44px; font-weight: 800; letter-spacing: 1px; margin: 10px 0 4px; }
  .zh { font-size: 24px; color: var(--muted); }
  .sayb { width: auto; flex: 0 0 auto; border: 0; border-radius: 99px; padding: 10px 20px; font: inherit; font-size: 19px; font-weight: 700; cursor: pointer; }
  .sayb.zhb { background: #f1ebff; color: #5b3fc4; } .sayb.enb { background: #e6efff; color: #2f62d0; }
  .sayb.sm { font-size: 14px; padding: 5px 12px; }
  .says { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-top: 14px; }
  .says.inline { flex-direction: row; justify-content: center; margin: 4px 0 12px; }
  .ex { font-size: 18px; margin-top: 14px; background: #fff8ec; padding: 12px; border-radius: 14px; }
  .speak { border: 0; background: #fff1d6; border-radius: 50%; width: 64px; height: 64px; font-size: 30px; margin-top: 14px; cursor: pointer; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .q { text-align: center; }
  .q .prompt { font-size: 26px; font-weight: 700; margin: 6px 0 16px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { background: #fff; border: 3px solid #f0e6d8; border-radius: 18px; padding: 18px 8px; font: inherit; font-size: 22px; font-weight: 700; color: var(--ink); cursor: pointer; min-height: 84px; }
  .opt.pic { font-size: 56px; padding: 10px; }
  .opt.right { border-color: var(--ok); background: #e5f8ee; }
  .opt.wrong { border-color: var(--bad); background: #ffe9e9; }
  .slots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 16px; min-height: 54px; }
  .slot { width: 40px; height: 50px; border-bottom: 4px solid #d8cbb8; font-size: 30px; font-weight: 800; display: grid; place-items: center; }
  .slots.long { gap: 2px; flex-wrap: nowrap; } .slots.long .slot { flex: 1 1 0; min-width: 0; max-width: 26px; width: auto; height: 44px; font-size: 22px; }
  .slots.long .slot.gap { max-width: 10px; }
  .slot.given { border-bottom-color: transparent; color: var(--muted); }
  .slot.gap { width: 14px; border-bottom-color: transparent; }
  .slot.blank { border-bottom-color: var(--accent); background: #fff8ec; border-radius: 8px 8px 0 0; color: var(--big); }
  .tiles { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .tile { width: 50px; height: 54px; border: 0; border-radius: 14px; background: var(--big); color: #fff; font-size: 26px; font-weight: 800; box-shadow: 0 3px 0 #0003; cursor: pointer; }
  .tile:disabled { opacity: .25; }
  .feedback { font-size: 22px; font-weight: 800; min-height: 34px; margin-top: 12px; }
  .feedback.ok { color: var(--ok); } .feedback.no { color: var(--bad); }
  .done { text-align: center; padding: 30px 20px; }
  .done .emoji { font-size: 80px; }
  label { display: block; font-weight: 700; margin: 12px 0 6px; }
  input, select { width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 12px; border: 2px solid #eadfcd; background: #fff; }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f3ebdf; }
  .del { border: 0; background: #ffe9e9; color: var(--bad); border-radius: 10px; padding: 6px 10px; font: inherit; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  .pop { animation: pop .25s ease-out; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// 在 LINE 裡打開時，改用手機的瀏覽器開（Android：Chrome／iPhone：Safari）。
// LINE 內建瀏覽器常常不能發音，資料也跟一般瀏覽器分開存。
if (/\bLine\//i.test(navigator.userAgent) && !/openExternalBrowser=1/.test(location.search)) {
  const u = new URL(location.href);
  u.searchParams.set("openExternalBrowser", "1");
  location.replace(u.toString());
}
// ===== 單字 =====
// 2026-11-25 Ben 決定拿掉內建單字，全部由家長自己加（老師的單字表）

const KIDS = {
  big:   { label: "Ethan", old: "老大", born: 2016, color: "blue" },
  small: { label: "Justin", old: "老二", born: 2018, color: "purple" }
};

// ===== 存檔（存在這支手機的瀏覽器裡）=====
let screen = "";
const KEY = "vocab-app-v1";
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
// 兩個孩子預設都從同一份 Google 試算表抓單字，各讀自己名字的分頁（Ethan／Justin）（2026-11-25 Ben 指定）
const DEFAULT_SHEET = "https://docs.google.com/spreadsheets/d/1G0-2gCxME40guRl5h4ehmTT4DV7Pkz7d05DCIGsgNC0/edit";
const OLD_SHEETS = ["1lKaVKEaJsgoNyCk_vx6WGFQm_p821aVN10hwRXoAMks"];
let db = load();
for (const id in KIDS) {
  db[id] = Object.assign({ name: KIDS[id].label, stars: 0, box: {}, custom: [] }, db[id]);
  if (!db[id].sheet || OLD_SHEETS.some(x => db[id].sheet.includes(x))) db[id].sheet = DEFAULT_SHEET;
  if (db[id].name === KIDS[id].old) db[id].name = KIDS[id].label; // 舊預設名改成新名字
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }

function wordsOf(id) { return db[id].custom; }
// 練習範圍：試算表有編號時，可以只練某幾號（例如 1～20）；沒設就練全部
function rangeOf(id) { const r = db[id].range; return r && r.from != null && r.to != null ? r : null; }
function practiceWords(id) {
  const r = rangeOf(id);
  return r ? wordsOf(id).filter(w => w.no != null && w.no >= r.from && w.no <= r.to) : wordsOf(id);
}
const numbers = id => [...new Set(wordsOf(id).map(w => w.no).filter(n => n != null))].sort((a, b) => a - b);
function boxOf(id, en) { return db[id].box[en] || 0; }           // 0 = 還沒看過
function setBox(id, en, b) { db[id].box[en] = Math.max(1, Math.min(5, b)); save(); }
function learnedCount(id) { return wordsOf(id).filter(w => boxOf(id, w.en) >= 4).length; }

// 盒子越低越常出現：先挑低盒子，同盒子隨機；家長加的（老師的單字）再優先一點
function pickWords(id, n) {
  const mine = new Set(db[id].custom.map(w => w.en));
  return practiceWords(id)
    .map(w => ({ w, k: (boxOf(id, w.en) === 0 ? 0.5 : boxOf(id, w.en)) - (mine.has(w.en) ? 0.4 : 0), r: Math.random() }))
    .sort((a, b) => a.k - b.k || a.r - b.r)
    .slice(0, n).map(x => x.w);
}
const hasPic = w => w.emoji && w.emoji !== "🔤";
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ===== 發音 =====
// 單字優先播「真人美式錄音」（免費字典 dictionaryapi.dev，只送出單字本身）；
// 沒有錄音的（片語、例句）改用手機裡最標準的美式語音。
const AUDIO_KEY = "vocab-audio-v1";
let audioUrls = {};
try { audioUrls = JSON.parse(localStorage.getItem(AUDIO_KEY)) || {}; } catch {}
const player = new Audio();
player.preload = "auto";
// 0.1 秒的無聲音檔（用程式產生）
function silentWav() {
  const n = 800, b = new ArrayBuffer(44 + n), v = new DataView(b), w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, "data"); v.setUint32(40, n, true);
  for (let k = 0; k < n; k++) v.setUint8(44 + k, 128);
  let bin = ""; new Uint8Array(b).forEach(x => bin += String.fromCharCode(x));
  return "data:audio/wav;base64," + btoa(bin);
}
// iPhone 要先在「手指點擊」裡播過一次，之後才能自動播放
let unlocked = false;
function unlockAudio() {
  if (unlocked) return; unlocked = true;
  player.src = silentWav();
  player.play().catch(() => {});
}
document.addEventListener("touchend", unlockAudio, { once: true, capture: true });
document.addEventListener("click", unlockAudio, { once: true, capture: true });

async function lookupAudio(word) {
  const key = word.toLowerCase();
  if (key in audioUrls) return audioUrls[key];
  let url = "";
  try {
    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`);
    if (r.ok) {
      const all = (await r.json()).flatMap(e => e.phonetics || []).map(p => p.audio).filter(Boolean);
      url = all.find(u => /-us\.mp3$/.test(u)) || "";        // 只要美式錄音
    }
  } catch { return ""; }                                     // 網路問題：不記錄，下次再試
  audioUrls[key] = url;
  localStorage.setItem(AUDIO_KEY, JSON.stringify(audioUrls));
  return url;
}
// 先把接下來要用的字查好，播放時才不會等
function prefetchAudio(words) { words.forEach(w => /^[A-Za-z'-]+$/.test(w.en) && lookupAudio(w.en)); }

// 這個瀏覽器能不能用語音念（LINE 內建瀏覽器常常不行）
function canTTS() { return !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance === "function"; }
// 挑手機裡最標準的美式語音：高品質版本優先，避開搞笑音效類語音
const GOOD_VOICES = ["Samantha", "Ava", "Allison", "Susan", "Zoe", "Nicky", "Evan", "Tom", "Joelle", "Noelle",
  "Google US English", "Microsoft Aria", "Microsoft Jenny", "Microsoft Guy"];
const SILLY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Fred|Good News|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Kathy|Grandpa|Grandma|Rocko|Shelley|Eddy|Flo|Reed|Sandy/i;
let bestVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => !SILLY.test(v.name));
  const us = vs.filter(v => /^en[-_]US$/i.test(v.lang));
  const score = v => {
    const i = GOOD_VOICES.findIndex(n => v.name.includes(n));
    return (i < 0 ? 100 : i) - (/premium/i.test(v.name) ? 60 : /enhanced/i.test(v.name) ? 40 : 0);
  };
  bestVoice = us.sort((a, b) => score(a) - score(b))[0] || vs.find(v => /^en/i.test(v.lang)) || null;
}
// 國語：優先台灣口音（iPhone 美佳、Google 國語（臺灣）），沒有再用其他中文語音
let zhVoice = null;
function pickZhVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^(zh|cmn)/i.test(v.lang));
  const score = v => (/TW|Hant/i.test(v.lang) ? 0 : /HK|yue/i.test(v.lang) ? 50 : 20)
    - (/premium/i.test(v.name) ? 6 : /enhanced/i.test(v.name) ? 4 : 0) - (/Mei-?Jia|美佳/i.test(v.name) ? 2 : 0);
  zhVoice = vs.sort((a, b) => score(a) - score(b))[0] || null;
}
if (canTTS()) { pickVoice(); pickZhVoice(); speechSynthesis.onvoiceschanged = () => { pickVoice(); pickZhVoice(); }; }
function speakZh(text) {
  player.pause();
  if (!canTTS()) return toast("這個瀏覽器沒辦法念國語，請用 Chrome 或 Safari 打開單字星球");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-TW"; u.rate = 0.9;
  if (!zhVoice) pickZhVoice();
  if (zhVoice) u.voice = zhVoice;
  speechSynthesis.speak(u);
}
// 中文字加上可以點的國語發音
const zhSay = (zh, cls = "") => zh ? `<button class="sayb zhb ${cls}" data-sayzh="${esc(zh)}">國語🔈</button>` : "";
const enSay = (en, cls = "", label = "英語🔈") => `<button class="sayb enb ${cls}" data-say="${esc(en)}">${label}</button>`;
function ttsSpeak(text) {
  if (!(canTTS())) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.85;
  if (!bestVoice) pickVoice();
  if (bestVoice) u.voice = bestVoice;
  speechSynthesis.speak(u);
}
function speakFallback(text) {
  if (canTTS()) return ttsSpeak(text);
  toast("這個瀏覽器沒辦法念這句，請用 Chrome 或 Safari 打開單字星球");
}
function playUrl(url, text) {
  player.onerror = () => speakFallback(text);              // 錄音載不下來 → 改用語音
  player.src = url;
  const p = player.play();
  if (p) p.catch(err => { if (err.name !== "AbortError") speakFallback(text); });
}
function speak(text) {
  player.pause();
  if (canTTS()) speechSynthesis.cancel();
  const key = text.toLowerCase();
  if (/^[A-Za-z'-]+$/.test(text)) {                         // 單一個字才用真人錄音
    if (key in audioUrls) {                                 // 查過：在點擊當下直接播（Android 比較不會擋）
      return audioUrls[key] ? playUrl(audioUrls[key], text) : speakFallback(text);
    }
    return lookupAudio(text).then(url => url ? playUrl(url, text) : speakFallback(text));
  }
  speakFallback(text);
}
let toastTimer;
function toast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);background:#3a2e22;color:#fff;padding:14px 16px;border-radius:14px;font-size:16px;text-align:center;z-index:9;box-shadow:0 6px 20px #0003";
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = "none", 3500);
}

// ===== 畫面 =====
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let cur = null; // 目前角色 id

function header(title, back) {
  return `<header>${back ? `<button class="back" data-go="${back}" aria-label="返回">‹</button>` : ""}
    <h1>${title}</h1>${cur ? `<div class="stars">⭐ ${db[cur].stars}</div>` : ""}</header>`;
}

function showHome() {
  cur = null; screen = "home";
  app.innerHTML = header("🌍 單字星球") + Object.keys(KIDS).map(id => {
    const k = KIDS[id], total = wordsOf(id).length, got = learnedCount(id);
    return `<button class="card kid ${id}" data-kid="${id}">
      <div style="flex:1"><b>${esc(db[id].name)}</b>
        <span>⭐ ${db[id].stars}　學會 ${got} / ${total} 個字</span>
        <div class="progress"><i style="width:${total ? got / total * 100 : 0}%"></i></div></div>
    </button>`;
  }).join("") + `<p class="muted" style="text-align:center">點自己的角色開始 👆</p>
    <div style="text-align:center"><button class="btn gray" data-go="parent" style="font-size:16px;padding:12px 20px">⚙️ 家長區</button></div>`;
}

function showKid(id) {
  cur = id; screen = "kid";
  const k = KIDS[id], total = wordsOf(id).length, got = learnedCount(id);
  app.innerHTML = header(esc(db[id].name), "home") + `
    <div class="card"><div style="display:flex;justify-content:space-between"><b>學會的單字</b><span>${got} / ${total}</span></div>
      <div class="progress"><i style="width:${total ? got / total * 100 : 0}%"></i></div>
      <div class="muted">答對越多次，單字就越「熟」；不熟的字會更常出現</div></div>
    ${rangeCard(id)}
    <div class="menu">
      <button class="btn ${k.color}" data-go="cards">📖 單字卡<small>看圖、聽發音，一次 10 個字</small></button>
      <button class="btn orange" data-go="quiz">🎯 小測驗<small>${id === "small" ? "聽聲音、選圖片" : "選英文、拼拼看"}，答對拿星星</small></button>
    </div>`;
}

function rangeCard(id) {
  const nums = numbers(id);
  if (!nums.length) return "";
  const r = rangeOf(id), from = r ? r.from : nums[0], to = r ? r.to : nums[nums.length - 1];
  const box = (end, v) => `<input type="number" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" min="${nums[0]}" max="${nums[nums.length - 1]}" value="${v}" data-rng="${id}:${end}">`;
  const cnt = practiceWords(id).length;
  return `<div class="card"><b>📌 練習範圍（編號）</b>
    <div class="range">${box("from", from)}<span>到</span>${box("to", to)}
      <button class="btn gray" data-rngall="${id}" style="font-size:16px;padding:10px 14px">全部</button></div>
    <div class="muted">可編號 ${nums[0]}～${nums[nums.length - 1]}。${r ? `現在練第 ${r.from}～${r.to} 號，共 ${cnt} 個字` : `現在練全部 ${cnt} 個字`}</div></div>`;
}

// --- 單字卡 ---
let deck = [], di = 0;
function startCards() {
  if (!wordsOf(cur).length) return alert("還沒有單字喔！請爸爸媽媽到「⚙️ 家長區」加單字");
  if (!practiceWords(cur).length) return alert("這個範圍沒有單字，換一個範圍試試看");
  deck = pickWords(cur, 10); di = 0; prefetchAudio(deck); showCard();
}
function showCard() {
  if (di >= deck.length) return showDone("📖 這組看完了！", "去做小測驗，拿星星吧 🎯", "quiz");
  const w = deck[di];
  app.innerHTML = header(`📖 ${di + 1} / ${deck.length}`, "kid") + `
    <div class="card flash pop">
      ${hasPic(w) ? `<div class="emoji">${w.emoji}</div>` : ""}
      <div class="word">${esc(w.en)}</div>

// --- 挖空格：每次挖不同的字母 ---
// 記住每個字上次挖了哪幾格、每一格被挖過幾次；下次先挑「上次沒挖、被挖最少次」的位置
function letterIdx(en) { return [...en].map((c, i) => /[A-Za-z]/.test(c) ? i : -1).filter(i => i >= 0); }

  const idx = letterIdx(en), L = idx.length;
  let n = id === "big" ? Math.min(4, Math.max(1, Math.round(L * 0.4))) : (L <= 4 ? 1 : 2);
  n = Math.min(n, L - 1);                                   // 至少留一個字母當提示
  db[id].blanks = db[id].blanks || {};
  const key = en.toLowerCase(), h = db[id].blanks[key] || { last: [], used: {} };
  const fresh = idx.filter(i => !h.last.includes(i)), old = idx.filter(i => h.last.includes(i));
  const rank = arr => arr.map(i => ({ i, u: h.used[i] || 0, r: Math.random() }))
    .sort((a, b) => a.u - b.u || a.r - b.r).map(x => x.i);
  const pick = [...rank(fresh), ...rank(old)].slice(0, n).sort((a, b) => a - b);
  pick.forEach(i => h.used[i] = (h.used[i] || 0) + 1);

}

}

// --- 匯入單字表 ---
// 把貼上的文字拆成 { en, zh }。支援「pencil 鉛筆」同一行，
// 也支援原況文字常見的「英文一欄、中文一欄」分開排列（照順序配對）。
let impText = "", impRows = [];
function parseList(text) {
  const clean = s => s
    .replace(/^\s*[\(\[]?\d+[\.\)\]、:：]?\s*/, "")             // 開頭編號 1. 2) ③
    .replace(/\b(n|v|adj|adv|prep|pron|conj|phr|vt|vi)\.\s*/gi, "") // 詞性 n. v.
    .replace(/[\(（]\s*(n|v|adj|adv|prep|pron)\.?\s*[\)）]/gi, "")

  text = text.replace(/([\u3400-\u9fff])[ \t]+(?=[\u3400-\u9fff])/g, "$1"); // 辨識常把「鉛 筆」拆開
  text = text.replace(/[|｜]/g, " ");                                          // 表格線
  const lines = text.split(/\r?\n/).map(clean).filter(Boolean);
  const pairs = [], enOnly = [], zhOnly = [], order = [];
  // 標題、姓名欄這類不是單字的行，直接跳過
  const isHeader = l => /\d/.test(l) && !/^[\u3400-\u9fff]/.test(l) && /[A-Za-z]/.test(l) && !/[\u3400-\u9fff]/.test(l)
    || /^(unit|lesson|words?|vocabulary|spelling|name|date|class|week|no)\b/i.test(l)
    || /^[^A-Za-z]*(第.{1,3}[課週]|單元|單字|生字|姓名|日期|座號|班級|年.{0,2}班)/.test(l);
  for (const line of lines.filter(l => !isHeader(l))) {
    let en = (line.match(/[A-Za-z][A-Za-z'’\- ]*[A-Za-z]|[A-Za-z]/) || [""])[0].replace(/\s+/g, " ").trim();
    if (/^[a-z]/.test(en)) en = en.replace(/(\s+[A-Z]{1,3})+$/, "");    // 「pencil HE」：中文認錯變成的大寫亂碼
    const zh = (line.match(/[㐀-鿿][㐀-鿿、，,；;\/ ～~（）()…]*/g) || []).join(" ")
      .replace(/[，,；;\/ ]+$/, "").trim();
    if (en && zh) order.push({ en, zh });
    else if (en) { const p = { en, zh: "" }; order.push(p); enOnly.push(p); }
    else if (zh) zhOnly.push(zh);
  }
  // 英文、中文分在兩欄時，照順序配對；配不到的留空讓家長補（保持原本順序）
  enOnly.forEach((p, i) => { p.zh = zhOnly[i] || ""; });
  pairs.push(...order);
  const seen = new Set();
  return pairs.filter(p => p.en.length > 1 || /^[aI]$/.test(p.en))
    .filter(p => !seen.has(p.en.toLowerCase()) && seen.add(p.en.toLowerCase()));
}

// --- Google 試算表同步 ---
// 試算表要設成「知道連結的任何人：檢視者」，App 才讀得到。
// 欄位：第一列標題有「英文」「中文」（可選「例句」）；沒有標題就當 A 欄英文、B 欄中文。
const syncMsg = {};
function sheetParts(url) {
  const id = (String(url).match(/\/d\/([A-Za-z0-9_-]{20,})/) || String(url).match(/^([A-Za-z0-9_-]{20,})$/) || [])[1];
  const gid = (String(url).match(/[#&?]gid=(\d+)/) || [])[1] || "";
  return id ? { id, gid } : null;
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(Boolean));
}
async function syncSheet(id) {
  const sp = sheetParts(db[id].sheet || "");
  const show = m => { syncMsg[id] = m; if (screen === "parent") showParent(); };
  if (!sp) return show("⚠️ 先貼上試算表網址");
  show("🔄 抓取中…");
  let text;
  try {
    // 網址有指定分頁（gid）就用它；沒有就讀跟孩子同名的分頁（Ethan／Justin）
    const tab = sp.gid ? `gid=${sp.gid}` : `sheet=${encodeURIComponent(KIDS[id].label)}`;
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${sp.id}/gviz/tq?tqx=out:csv&${tab}&t=${Date.now()}`);
    text = await r.text();
    if (!r.ok || /^\s*<!DOCTYPE|<html/i.test(text)) throw new Error("locked");
  } catch {
    return show("⚠️ 讀不到試算表。請確認試算表已設成「知道連結的任何人：檢視者」，網路也有連上");
  }
  const rows = parseCSV(text);
  // 試算表可以分區：最上面寫孩子名字（Ethan／Justin），下面一列是「英文、中文」標題
  // 找到名字就只讀那一區；沒有名字就讀整張表
  const lc = v => String(v || "").trim().toLowerCase();
  const names = [db[id].name, KIDS[id].label].map(lc);
  let r0 = -1, c0 = -1;
  for (let r = 0; r < Math.min(3, rows.length) && r0 < 0; r++)
    rows[r].forEach((v, c) => { if (r0 < 0 && names.some(n => lc(v) === n || lc(v).startsWith(n + " "))) { r0 = r; c0 = c; } });
  const otherNames = Object.keys(KIDS).filter(k => k !== id).flatMap(k => [db[k].name, KIDS[k].label]).map(lc);
  const otherHasSection = rows.slice(0, 3).some(row => row.some(v => otherNames.some(n => lc(v) === n || lc(v).startsWith(n + " "))));
  if (r0 < 0 && otherHasSection) return show(`⚠️ 試算表裡找不到「${KIDS[id].label}」分頁（分頁名稱和 A1 格都要寫 ${KIDS[id].label}）`);
  let ci = { en: 0, zh: 1, ex: -1 }, start = 0;
  const EN = /英文|english|word|單字/;
  const hr = r0 < 0 ? 0 : (rows[r0] || []).some(v => EN.test(lc(v))) ? r0 : r0 + 1;   // 標題列（名字可以跟標題在同一列，例如「Ethan No.」）
  const lo = c0 >= 0 ? c0 : 0;                              // 這一區從哪一欄開始
  const head = (rows[hr] || []).map(lc);
  const find = re => head.findIndex((h, i) => i >= lo && (c0 < 0 || i <= lo + 2) && re.test(h));
  if (find(EN) >= 0) {
    ci = { en: find(EN), zh: find(/中文|chinese|meaning|意思|翻譯/), ex: find(/例句|example|sentence/), no: find(/(^|\s)no\.?$|編號|序號|號碼|^#$/) };
    start = hr + 1;
  } else if (c0 >= 0) {
    ci = { en: c0, zh: c0 + 1, ex: -1 }; start = r0 + 1;
  }
  const have = new Set(wordsOf(id).map(w => w.en.toLowerCase()));
  const added = [], noZh = [], now = Date.now(); let dup = 0, renum = 0;
  const byEn = new Map(wordsOf(id).map(w => [w.en.toLowerCase(), w]));
  for (const r of rows.slice(start)) {
    const en = (r[ci.en] || "").replace(/\s+/g, " ").trim(), zh = ci.zh >= 0 ? (r[ci.zh] || "") : "";
    const nv = ci.no >= 0 ? parseInt(r[ci.no], 10) : NaN, no = Number.isFinite(nv) ? nv : undefined;
    if (!en || !/[A-Za-z]/.test(en)) continue;
    if (have.has(en.toLowerCase())) {                       // 已經有的字：只更新編號
      const w = byEn.get(en.toLowerCase());
      if (w && no !== undefined && w.no !== no) { w.no = no; renum++; }
      dup++; continue;
    }
    if (!zh) { noZh.push(en); continue; }
    have.add(en.toLowerCase());
    db[id].custom.push({ en, zh, emoji: "🔤", ex: ci.ex >= 0 ? (r[ci.ex] || "") : "", added: now, ...(no !== undefined ? { no } : {}) });
    added.push(en);
  }
  db[id].lastSync = now; save();
  const list = a => a.slice(0, 8).join("、") + (a.length > 8 ? "…" : "");
  show([
    added.length ? `✅ 新增 ${added.length} 個：${list(added)}` : "✅ 沒有新單字",
    dup ? `已經有的 ${dup} 個，跳過` : "",
    renum ? `🔢 更新了 ${renum} 個字的編號` : "",
    noZh.length ? `✏️ 還沒填中文的 ${noZh.length} 個（${list(noZh)}）先跳過，在試算表填好中文再按一次` : ""
  ].filter(Boolean).join("\n"));

      `<button class="btn ${k === id ? KIDS[k].color : "gray"}" data-list="${k}" style="font-size:17px;padding:12px">${esc(db[k].name)}</button>`).join("")}</div>
    <div class="card"><b>${esc(db[id].name)}</b> 共 ${all.length} 個字，已學會 ${learnedCount(id)} 個
      <div class="muted" style="margin-top:4px">●●●○○ 是熟練度，滿 4 顆算學會 ✅</div></div>
    <div class="card"><b>📝 單字（新加的在上面）</b><ul class="list">${
      mine.map(({ w, i }) => wordRow(id, w, i)).join("") || `<li class="muted">還沒有單字，回家長區加單字</li>`}</ul></div>`;
}

// --- 家長區 ---
// 家長區暫時隱藏的區塊（2026-11-25 Ben 要求先隱藏；改成 true 就會再出現）
const SHOW_NAME_EDIT = false, SHOW_PHOTO_IMPORT = false, SHOW_SHEET_SYNC = false; // 試算表隱藏後仍會在打開 App 時自動抓
function showParent() {
  screen = "parent";
  cur = null;
  app.innerHTML = header("⚙️ 家長區", "home") + (SHOW_NAME_EDIT ? Object.keys(KIDS).map(id => `
    <div class="card"><label>名字（${KIDS[id].born} 年生）</label>
      <input data-name="${id}" value="${esc(db[id].name)}" maxlength="10"></div>`).join("") : "") +
    // 隱藏時，捷徑帶單字進來仍會顯示這塊，才看得到要匯入的清單
    (SHOW_PHOTO_IMPORT || impRows.length || impStatus ? `
    <div class="card"><b>📷 拍照匯入老師的單字表</b>
      <label>給誰</label><select id="impWho"><option value="big">${esc(db.big.name)}</option><option value="small">${esc(db.small.name)}</option></select>
      ${impStatus ? `<div id="impStatus" style="margin:12px 0;padding:12px;border-radius:14px;background:#fff1d6;font-weight:700">${esc(impStatus)}</div>` : ""}
      <p class="muted" style="line-height:1.6">在 iPhone 主畫面點「拍單字表」捷徑 → 拍照 → 會自動打開這裡，列好單字。<br>
        小撇步：光線亮一點、單字表擺正、只拍單字那一塊。</p>
      <details><summary class="muted">第一次用：建立「拍單字表」捷徑（約 5 分鐘）</summary>
        <ol class="muted" style="padding-left:20px;line-height:1.8">
          <li>打開 iPhone 的「捷徑」App，點右上角 ＋</li>
          <li>點「加入動作」，搜尋「拍照」，點它加進來</li>
          <li>搜尋「擷取文字」，加入「從影像中擷取文字」</li>
          <li>搜尋「編碼」，加入「URL 編碼」</li>
          <li>搜尋「文字」，加入「文字」動作，裡面輸入：<br><code style="word-break:break-all;color:#3a2e22">https://benfriendship.github.io/word-planet/#import=</code><br>
            再點鍵盤上方的「URL 編碼的文字」變數，接在最後面</li>
          <li>搜尋「打開 URL」，加進來</li>
          <li>最上面把名稱改成「拍單字表」，點名稱旁的箭頭 →「加入主畫面」</li>
        </ol></details>
      <details ${impText && !impRows.length ? "open" : ""}><summary class="muted">改用貼上文字</summary>
      <textarea id="impText" rows="6" placeholder="例如：&#10;1. pencil 鉛筆&#10;2. eraser 橡皮擦" style="width:100%;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid #eadfcd">${esc(impText)}</textarea>
      <button class="btn gray" data-parse style="width:100%;margin-top:12px;font-size:17px">✨ 整理單字</button></details>
      ${impRows.length ? `<p class="muted">找到 ${impRows.length} 個字，請檢查一下：認錯的直接改，不是單字的按 ✕</p>
        <div id="impRows">${impRows.map((r, i) => `<div style="display:flex;gap:6px;margin-bottom:6px">
          <input data-imp="${i}:en" value="${esc(r.en)}" placeholder="英文" autocapitalize="off" style="flex:1">
          <input data-imp="${i}:zh" value="${esc(r.zh)}" placeholder="中文" style="flex:1">
          <button class="del" data-impdel="${i}">✕</button></div>`).join("")}</div>
        <button class="btn green" data-import style="width:100%;margin-top:8px">✅ 匯入這 ${impRows.length} 個字</button>` : ""}
    </div>` : "") + `
    <div class="card"><b>📋 單字總表</b>
      <p class="muted">看每個孩子有哪些單字、什麼時候加的、熟練到哪裡，也可以在這裡刪除。</p>
      <div class="row">${Object.keys(KIDS).map(id => `<button class="btn ${KIDS[id].color}" data-list="${id}" style="font-size:17px;padding:14px">${esc(db[id].name)}<small>${db[id].custom.length} 個字</small></button>`).join("")}</div></div>
    ${SHOW_SHEET_SYNC ? `<div class="card"><b>🔄 從 Google 試算表抓單字</b>
      <p class="muted">已經有的單字不會重複加；還沒填中文的先跳過。</p>
      ${Object.keys(KIDS).map(id => `
        <label>${esc(db[id].name)} 的試算表網址</label>
        <input data-sheet="${id}" value="${esc(db[id].sheet || "")}" placeholder="貼上 Google 試算表網址" autocapitalize="off">
        <button class="btn ${KIDS[id].color}" data-sync="${id}" style="width:100%;margin-top:8px;font-size:17px;padding:14px">🔄 抓 ${esc(db[id].name)} 的新單字</button>
        ${db[id].lastSync ? `<div class="muted" style="margin-top:4px">上次抓取：${fmtTime(db[id].lastSync)}</div>` : ""}
        ${syncMsg[id] ? `<div style="white-space:pre-line;margin-top:8px;padding:10px;border-radius:12px;background:#fff1d6">${esc(syncMsg[id])}</div>` : ""}`).join("")}
    </div>` : ""}
    <div class="card"><b>➕ 加自己的單字</b>
      <label>給誰</label><select id="who"><option value="big">${esc(db.big.name)}</option><option value="small">${esc(db.small.name)}</option></select>
      <label>英文</label><input id="en" placeholder="例如 pencil" autocapitalize="off">
      <label>中文</label><input id="zh" placeholder="例如 鉛筆">
      <label>圖示（可不填）</label><input id="emo" placeholder="例如 ✏️">
      <label>例句（可不填，老大才會顯示）</label><input id="ex" placeholder="例如 I have a pencil.">
      <button class="btn green" data-add style="width:100%;margin-top:14px">加進去</button></div>
    <div class="card"><button class="btn gray" data-reset style="width:100%;font-size:16px">重設學習進度與星星</button>
      <p class="muted">只清掉進度和星星，單字會留著。</p></div>`;
}

// ===== 點擊處理 =====
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.kid) return showKid(d.kid);
  if (d.go === "home") return showHome();
  if (d.go === "kid") return showKid(cur);
  if (d.go === "cards") return startCards();
  if (d.go === "quiz") return startQuiz();
  if (d.go === "parent") return showParent();
  if (d.list) return showList(d.list);
  if (d.sync) { const inp = app.querySelector(`[data-sheet="${d.sync}"]`); if (inp) { db[d.sync].sheet = inp.value.trim(); save(); } return syncSheet(d.sync); }
  if (d.rngall) { db[d.rngall].range = null; save(); return showKid(d.rngall); }
  if (d.say) return speak(d.say);
  if (d.sayzh) return speakZh(d.sayzh);
  if (d.card) return cardAnswer(d.card === "ok");
  if (d.ans !== undefined && !locked) {
    const ok = d.ans === qs[qi].w.en;
    t.classList.add(ok ? "right" : "wrong");
    if (!ok) app.querySelector(`[data-ans="${CSS.escape(qs[qi].w.en)}"]`)?.classList.add("right");
    return judge(ok);
  }
  if (d.tile !== undefined && !locked) return tapTile(t);
  if ("undo" in d && !locked) return undoTile();
  if ("add" in d) {
    const v = id => document.getElementById(id).value.trim();
    const en = v("en"), zh = v("zh");
    if (!en || !zh) return alert("英文和中文都要填喔");
    const who = v("who");
    db[who].custom.push({ en, zh, emoji: v("emo") || "🔤", ex: v("ex"), added: Date.now() });
    save(); return showParent();
  }
  if ("parse" in d) {
    impText = document.getElementById("impText").value;
    impRows = parseList(impText);
    if (!impRows.length) alert("沒找到英文單字，確認一下有沒有貼上喔");
    const who = document.getElementById("impWho").value;
    showParent(); document.getElementById("impWho").value = who;
    return document.getElementById("impRows")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  if (d.impdel !== undefined) {
    const who = document.getElementById("impWho").value;
    readImpRows(); impRows.splice(+d.impdel, 1);
    showParent(); document.getElementById("impWho").value = who; return;
  }
  if ("import" in d) {
    readImpRows();
    const who = document.getElementById("impWho").value;
    const missing = impRows.filter(r => !r.en || !r.zh);
    if (missing.length) return alert(`還有 ${missing.length} 個字沒填中文或英文，補上或按 ✕ 刪掉再匯入`);
    const have = new Set(wordsOf(who).map(w => w.en.toLowerCase()));
    const add = impRows.filter(r => !have.has(r.en.toLowerCase()));
    const now = Date.now();
    add.forEach(r => db[who].custom.push({ en: r.en, zh: r.zh, emoji: "🔤", ex: "", added: now }));
    save();
    const skip = impRows.length - add.length;
    impRows = []; impText = ""; impStatus = "";
    alert(`匯入 ${add.length} 個字給 ${db[who].name}！${skip ? `（${skip} 個本來就有，跳過）` : ""}\n新的字會優先出現在單字卡和測驗。`);
    return showParent();
  }
  if (d.del) {
    const [id, i] = d.del.split(":"), w = db[id].custom[+i];
    if (!w || !confirm(`確定要刪除「${w.en} ${w.zh}」嗎？`)) return;
    db[id].custom.splice(+i, 1); save(); return screen === "list" ? showList(id) : showParent();
  }
  if ("reset" in d && confirm("確定要重設兩個孩子的進度和星星嗎？")) {
    for (const id in KIDS) { db[id].box = {}; db[id].stars = 0; }
    save(); return showParent();
  }
});
app.addEventListener("change", e => {
  if (e.target.dataset.rng) {
    const [id, end] = e.target.dataset.rng.split(":"), nums = numbers(id), r = rangeOf(id) || { from: nums[0], to: nums[nums.length - 1] };
    const v = parseInt(e.target.value, 10);
    if (!Number.isFinite(v)) return showKid(id);                  // 空白或亂打 → 還原
    r[end] = Math.min(nums[nums.length - 1], Math.max(nums[0], v)); // 超出範圍就拉回最小／最大編號
    if (r.from > r.to) [r.from, r.to] = end === "from" ? [r.from, r.from] : [r.to, r.to];
    db[id].range = { from: r.from, to: r.to }; save(); return showKid(id);
  }
  if (e.target.dataset.sheet) { db[e.target.dataset.sheet].sheet = e.target.value.trim(); save(); return; }
  const id = e.target.dataset.name;
  if (id) { db[id].name = e.target.value.trim() || KIDS[id].label; save(); }
});

window.addEventListener("hashchange", () => sheetFromLink() || importFromLink());
if (!sheetFromLink() && !importFromLink()) showHome();
// 打開 App 時自動抓一次新單字（已經有的會跳過）；抓到新字就更新首頁的數字
(async () => {
  for (const id in KIDS) {
    const before = db[id].custom.length;
    await syncSheet(id);
    prefetchAudio(wordsOf(id));
    if (db[id].custom.length !== before && screen !== "parent" && !cur) showHome();
    if (screen === "kid" && cur === id) showKid(id);          // 在孩子頁面時，更新練習範圍選單
  }
})();
</script>
</body>
</html>
